<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CRM Sales & Operations Hub — Leads, Customers, Enquiries, Quotations, Booking & Pricing" />
    <title>CRM Sales Hub | Mandapelli Mounika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/crm.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="CRM navigation">
        <div class="sidebar-brand">
          <div class="brand-icon" aria-hidden="true">CRM</div>
          <div>
            <h1 class="brand-title">Sales Hub</h1>
            <p class="brand-sub">Freight Forwarding ERP</p>
          </div>
        </div>
        <nav id="nav" class="sidebar-nav" aria-label="Modules"></nav>
        <div class="sidebar-footer">
          <a href="/" class="back-link">← Back to Portfolio</a>
          <p class="built-by">Built by Mandapelli Mounika</p>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div>
            <h2 id="page-title" class="page-title">Dashboard</h2>
            <p id="page-subtitle" class="page-subtitle">Overview of your sales pipeline</p>
          </div>
          <div class="topbar-actions">
            <div class="search-wrap">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <input type="search" id="global-search" class="search-input" placeholder="Search records..." aria-label="Search records" />
            </div>
            <button type="button" id="add-btn" class="btn btn-primary" hidden>Add New</button>
          </div>
        </header>

        <main id="content" class="content" aria-live="polite"></main>
      </div>
    </div>

    <dialog id="modal" class="modal" aria-labelledby="modal-title">
      <form id="modal-form" method="dialog" class="modal-body">
        <div class="modal-header">
          <h3 id="modal-title" class="modal-title">Add Record</h3>
          <button type="button" id="modal-close" class="modal-close" aria-label="Close">&times;</button>
        </div>
        <div id="modal-fields" class="modal-fields"></div>
        <div class="modal-footer">
          <button type="button" id="modal-cancel" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
