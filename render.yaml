services:
  - type: web
    name: mounika-portfolio-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install && npx prisma generate && npm run build
    startCommand: cd server && npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 5000

databases:
  - name: mounika-portfolio-db
    plan: free
    databaseName: mounika_portfolio
    user: mounika_user
